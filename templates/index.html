<!DOCTYPE html>
<html>
<head>
    <title>Product Search</title>
    <style>
        body { font-family: Arial; background:#f5f5f5; margin:40px; }
        h1 { text-align:center; }
        #search-box {
            width:60%; padding:12px; font-size:18px;
            display:block; margin:20px auto;
            border:1px solid #ccc; border-radius:8px;
        }
        #results { width:80%; margin:auto; }
        .card {
            background:white; padding:15px; margin:10px 0;
            border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }
        .vrc-tag {
            background:#16a34a; color:white;
            padding:4px 10px; border-radius:20px;
            font-size:12px; font-weight:bold;
        }
        details { margin-top:12px; }
        details summary { padding:8px; background:#f3f4f6; border-radius:6px; }
        table { font-size:14px; }
        th { background:#f9fafb; }
        .vendor-block {
            margin-top:12px; padding:10px;
            border-radius:6px; font-size:14px;
        }
        .arc-block { background:#eff6ff; border-left:4px solid #2563eb; }
        .vrc-block { background:#f0fdf4; border-left:4px solid #16a34a; }
        .extra-vendor { display:none; }
        .extra-vendor.show { display:block; }
        .remaining-vendors {
            color:#0284c7; cursor:pointer; font-weight:bold;
            user-select:none; flex-shrink:0; margin-left:20px;
            white-space:nowrap;
        }
        .remaining-vendors:hover { text-decoration:underline; }
    </style>
</head>
<body>

<h1>Product Search</h1>
<input type="text" id="search-box" placeholder="Search products...">
<div id="results"></div>

<script>
const searchBox = document.getElementById("search-box");
const resultsDiv = document.getElementById("results");
let allProducts = [];
let currentPage = 1;
const pageSize = 10;
let debounceTimer;

function toggleVendors(productId, vendorType) {
    const container = document.getElementById(`${vendorType}-vendors-${productId}`);
    const toggle = document.getElementById(`${vendorType}-toggle-${productId}`);
    if (!container || !toggle) return;

    const extras = container.querySelectorAll('.extra-vendor');
    const isExpanded = toggle.dataset.expanded === 'true';

    if (isExpanded) {
        extras.forEach(v => v.classList.remove('show'));
        toggle.dataset.expanded = 'false';
        toggle.textContent = `+${extras.length} more vendor${extras.length > 1 ? 's' : ''}`;
    } else {
        extras.forEach(v => v.classList.add('show'));
        toggle.dataset.expanded = 'true';
        toggle.textContent = vendorType === 'arc' ? `- fewer clients` : `- fewer vendors`;;
    }
}

function buildArcHtml(arcVendors, productId) {
    if (arcVendors.length === 0) return "";

    let html = `<div id="arc-vendors-${productId}">`;

    arcVendors.forEach((arcVendor, vendorIdx) => {
        const validityDate = arcVendor.validityPeriod
            ? new Date(arcVendor.validityPeriod).toLocaleDateString("en-IN")
            : "-";

        const isFirst = vendorIdx === 0;
        const isLast = vendorIdx === arcVendors.length - 1;
        const extraClass = isFirst ? '' : 'extra-vendor';

        // Toggle link goes on the first vendor's last line, if multiple vendors
        const toggleHtml = isFirst && arcVendors.length > 1
            ? `<span class="remaining-vendors" id="arc-toggle-${productId}" data-expanded="false" onclick="toggleVendors('${productId}', 'arc')">+${arcVendors.length - 1} more client${arcVendors.length - 1 > 1 ? 's' : ''}</span>`
            : '';

        html += `
            <div class="vendor-block arc-block ${extraClass}">
                <b>ARC Client:</b> ${arcVendor.companyName || "-"}
                &nbsp;|&nbsp;
                <b>ERP Code:</b> ${arcVendor.companyERPCode ?? "-"}
                &nbsp;|&nbsp;
                <b>Branch:</b> ${arcVendor.branchName ?? "-"}
                <br><br>
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div>
                        <b>Unit Price:</b> ${arcVendor.UnitPrice ?? "-"}
                        &nbsp;|&nbsp;
                        <b>Lead Time:</b> ${arcVendor.arcLeadTime ?? "-"}
                        &nbsp;|&nbsp;
                        <b>Validity:</b> ${validityDate}
                    </div>
                    ${toggleHtml}
                </div>
            </div>
        `;
    });

    html += `</div>`;
    return html;
}

function buildVrcHtml(vrcVendors, productId) {
    if (vrcVendors.length === 0) return "";

    let html = `<div id="vrc-vendors-${productId}">`;

    vrcVendors.forEach((v, vendorIdx) => {
        const isFirst = vendorIdx === 0;
        const extraClass = isFirst ? '' : 'extra-vendor';

        const toggleHtml = isFirst && vrcVendors.length > 1
            ? `<span class="remaining-vendors" id="vrc-toggle-${productId}" data-expanded="false" onclick="toggleVendors('${productId}', 'vrc')">+${vrcVendors.length - 1} more vendor${vrcVendors.length - 1 > 1 ? 's' : ''}</span>`
            : '';

        html += `
            <div class="vendor-block vrc-block ${extraClass}">
                <b>VRC Vendor:</b> ${v.companyName || "-"}
                &nbsp;|&nbsp;
                <b>Geo Map Type:</b> ${v.geoMapType ?? "-"}
                &nbsp;|&nbsp;
                <b>State:</b> ${v.stateName ?? "-"}
                <br><br>
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div>
                        <b>Lead Time:</b> ${v.leadTime ?? "-"}
                        &nbsp;|&nbsp;
                        <b>List Price:</b> ${v.vrcListPrice ?? "-"}
                        &nbsp;|&nbsp;
                        <b>Discount:</b> ${v.discount ?? "-"}
                        &nbsp;|&nbsp;
                        <b>Contract Price:</b> ${v.contractPrice ?? "-"}
                    </div>
                    ${toggleHtml}
                </div>
            </div>
        `;
    });

    html += `</div>`;
    return html;
}

function renderPage() {
    if (allProducts.length === 0) {
        resultsDiv.innerHTML = `<div class="card">No products found.</div>`;
        return;
    }

    resultsDiv.innerHTML = "";
    const totalPages = Math.ceil(allProducts.length / pageSize);
    const start = (currentPage - 1) * pageSize;
    const pageProducts = allProducts.slice(start, start + pageSize);

    pageProducts.forEach((product, idx) => {
        const productId = `${currentPage}-${idx}`;

        const arcVendors = product.ARCvendors?.filter(
            a => String(a.ARC || "").trim().toUpperCase() === "ARC"
        ) || [];

        const vrcVendors = product.vendors?.filter(
            v => String(v.VRC || "").trim().toUpperCase() === "VRC"
        ) || [];

        const hasARC = arcVendors.length > 0;
        const hasVRC = vrcVendors.length > 0;

        resultsDiv.innerHTML += `
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <h3 style="margin:0;">${product.productName}</h3>
                    <div style="display:flex;gap:8px;">
                        ${hasARC ? '<span class="vrc-tag" style="background:#2563eb;">ARC</span>' : ''}
                        ${hasVRC ? '<span class="vrc-tag">VRC</span>' : ''}
                    </div>
                </div>
                <p>
                    <b>Material ID:</b> ${product.MaterialId}
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <b>Brand:</b> ${product.brandName}
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <b>Category:</b> ${product.categoryName || "-"}
                </p>
                <p><b>Variant Name:</b> ${product.variantName || "-"}</p>
                <p><b>Short Description:</b> ${product.shortDescription || "-"}</p>
                <p><b>Specification:</b> ${product.productSpecification}</p>
                <p>
                    <b>List Price:</b> ${product.listPrice || "-"}
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <b>UOM:</b> ${product.UOM || "-"}
                </p>
                ${buildArcHtml(arcVendors, productId)}
                ${buildVrcHtml(vrcVendors, productId)}
            </div>
        `;
    });

    resultsDiv.innerHTML += `
       <div style="display:flex;justify-content:center;gap:20px;margin-top:20px;">
           <button onclick="prevPage()" ${currentPage === 1 ? "disabled" : ""}>Previous</button>
           <span>Page ${currentPage} of ${totalPages}</span>
           <button onclick="nextPage()" ${currentPage === totalPages ? "disabled" : ""}>Next</button>
       </div>
    `;
}

function nextPage() {
   if (currentPage * pageSize < allProducts.length) {
       currentPage++;
       renderPage();
       window.scrollTo({ top: 0, behavior: "smooth" });
   }
}

function prevPage() {
   if (currentPage > 1) {
       currentPage--;
       renderPage();
       window.scrollTo({ top: 0, behavior: "smooth" });
   }
}

searchBox.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(async () => {
        const query = searchBox.value.trim();
        if (query.length === 0) { resultsDiv.innerHTML = ""; return; }
        const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
        allProducts = await response.json();
        currentPage = 1;
        renderPage();
    }, 300);
});
</script>

</body>
</html>
