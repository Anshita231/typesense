<!DOCTYPE html>
<html>
<head>
    <title>Product Search</title>

    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
            margin:40px;
        }

        h1{
            text-align:center;
        }

        #search-box{
            width:60%;
            padding:12px;
            font-size:18px;
            display:block;
            margin:20px auto;
            border:1px solid #ccc;
            border-radius:8px;
        }

        #results{
            width:80%;
            margin:auto;
        }

        .card{
            background:white;
            padding:15px;
            margin:10px 0;
            border-radius:10px;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }
        .vrc-tag{
            background:#16a34a;
            color:white;
            padding:4px 10px;
            border-radius:20px;
            font-size:12px;
            font-weight:bold;
        }

        details{
            margin-top:12px;
        }

        details summary{
            padding:8px;
            background:#f3f4f6;
            border-radius:6px;
        }

        table{
            font-size:14px;
        }

        th{
            background:#f9fafb;
        }
    </style>
</head>

<body>

    <h1>Product Search</h1>

    <input
        type="text"
        id="search-box"
        placeholder="Search products..."
    >

    <div id="results"></div>

    <script>

    const searchBox = document.getElementById("search-box");
    const resultsDiv = document.getElementById("results");

    let debounceTimer;

    searchBox.addEventListener("input", () => {

        clearTimeout(debounceTimer);

        debounceTimer = setTimeout(async () => {

            let query = searchBox.value.trim();

            if(query.length === 0){
                resultsDiv.innerHTML = "";
                return;
            }

            let response = await fetch(
                `/search?q=${encodeURIComponent(query)}`
            );

            let data = await response.json();

            resultsDiv.innerHTML = "";

            data.forEach(product => {

                let vendorsHtml = "";

                const vrcVendor =
                    product.vendors &&
                    product.vendors.find(
                        v => String(v.VRC || "").trim().toUpperCase() === "VRC"
                    );

                if(vrcVendor){

                    vendorsHtml = `
                        <div style="
                            margin-top:12px;
                            padding:10px;
                            background:#f0fdf4;
                            border-left:4px solid #16a34a;
                            border-radius:6px;
                            font-size:14px;
                        ">
                            <b>Vendor:</b> ${vrcVendor.companyName || "-"}
                            &nbsp; | &nbsp;
                            <b>List Price:</b> ${vrcVendor.vrcListPrice ?? "-"}
                            &nbsp; | &nbsp;
                            <b>Discount:</b> ${vrcVendor.discount ?? "-"}
                            &nbsp; | &nbsp;
                            <b>Contract Price:</b> ${vrcVendor.contractPrice ?? "-"}
                            <br><br>
                            <b>Geo Map Type:</b> ${vrcVendor.geoMapType ?? "-"}
                            &nbsp; | &nbsp;
                            <b>Lead Time:</b> ${vrcVendor.leadTime ?? "-"}
                            &nbsp; | &nbsp;
                            <b>State:</b> ${vrcVendor.stateName ?? "-"}
                        </div>
                    `;
                }

                const hasVRC =
                    product.vendors &&
                    product.vendors.some(
                        v => String(v.VRC || "").trim().toUpperCase() === "VRC"
                    );

                resultsDiv.innerHTML += `
                    <div class="card">

                        <div style="
                            display:flex;
                            justify-content:space-between;
                            align-items:center;
                        ">
                            <h3 style="margin:0;">
                                ${product.productName}
                            </h3>

                            ${
                                hasVRC
                                ? '<span class="vrc-tag">VRC</span>'
                                : ''
                            }
                        </div>

                        <p><b>Material ID:</b> ${product.MaterialId}</p>
                        <p><b>Brand:</b> ${product.brandName}</p>
                        <p><b>Variant Name:</b> ${product.variantName || "-"}</p>
                        <p><b>Specification:</b> ${product.productSpecification}</p>
                        <p><b>List Price:</b> ${product.listPrice || "-"}</p>

                        ${vendorsHtml}

                    </div>
                `;
            });
        }, 100);
});


</script>

</body>
</html>
