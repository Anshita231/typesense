<!DOCTYPE html>
<html>
<head>
    <title>Product Search</title>

    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
            margin:40px;
        }

        h1{
            text-align:center;
        }

        #search-box{
            width:60%;
            padding:12px;
            font-size:18px;
            display:block;
            margin:20px auto;
            border:1px solid #ccc;
            border-radius:8px;
        }

        #results{
            width:80%;
            margin:auto;
        }

        .card{
            background:white;
            padding:15px;
            margin:10px 0;
            border-radius:10px;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

    <h1>Product Search</h1>

    <input
        type="text"
        id="search-box"
        placeholder="Search products..."
    >

    <div id="results"></div>

    <script>

    const searchBox = document.getElementById("search-box");
    const resultsDiv = document.getElementById("results");

    let debounceTimer;

    searchBox.addEventListener("input", () => {

        clearTimeout(debounceTimer);

        debounceTimer = setTimeout(async () => {

            let query = searchBox.value.trim();

            if(query.length === 0){
                resultsDiv.innerHTML = "";
                return;
            }

            let response = await fetch(
                `/search?q=${encodeURIComponent(query)}`
            );

            let data = await response.json();

            resultsDiv.innerHTML = "";

            data.forEach(product => {

                resultsDiv.innerHTML += `
                    <div class="card">
                        <h3>${product.productName}</h3>
                        <p><b>Material ID:</b> ${product.MaterialId}</p>
                        <p><b>Brand:</b> ${product.brandName}</p>
                        <p><b>Variant Name:</b> ${product.variantName}</p>
                        <p><b>Specification:</b> ${product.productSpecification}</p>
                        <p><b>Price:</b> ${product.listPrice}</p>
                    </div>
                `;
            });

        }, 100);   // wait 300ms after typing stops
    });

</script>

</body>
</html>
